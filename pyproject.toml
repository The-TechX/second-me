[project]
name = "second-me"
version = "0.1.0"
description = "A small, portable memory engine for humans and agents."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
second-me = "second_me.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
